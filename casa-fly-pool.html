<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Fly Pool — Jakub Viskupič</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; color: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .logo { position: fixed; top: 28px; left: 32px; line-height: 0; }
    .logo img { height: 38px; width: auto; }
    .back { position: fixed; top: 32px; right: 36px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #000; text-decoration: none; opacity: 0.4; transition: opacity 0.2s; }
    .back:hover { opacity: 1; }
    main { padding: 110px 64px 80px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 13px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: #aaa; margin-bottom: 48px; }
    .images { display: flex; flex-direction: column; gap: 3px; }
    .images img { width: 100%; display: block; }
    footer { padding: 64px 0 44px; display: flex; justify-content: center; }
    footer img { height: 52px; opacity: 0.65; }
    @media (max-width: 600px) { main { padding: 100px 20px 60px; } .logo img { height: 30px; } .back { top: 24px; right: 20px; } }
  </style>
</head>
<body>
  <a href="/" class="logo"><img src="projects/jv_logo.png" alt="JV"></a>
  <a href="/" class="back">← Back</a>
  <main>
    <h1>Casa Fly Pool</h1>
    <div class="images">
      <img src="projects/casa_fly_pool.png" alt="Casa Fly Pool">

    </div>
  </main>
  <footer><img src="projects/jv_signature.png" alt="Jakub Viskupič"></footer>
</body>
</html>
